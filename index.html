<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ativ.btstrp</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
		      rel="stylesheet"
		      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
		      crossorigin="anonymous">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
		      rel="stylesheet">
	</head>
	<body>
		<nav class="navbar navbar-expand-lg p-4 bg-dark text-white"
		     data-bs-theme="dark">
			<div class="container-fluid">
				<i class="bi bi-mortarboard-fill"></i>
				<a
				   class="navbar-brand text-white me-auto"
				   href="#">Cursos</a>
				<button
				   class="navbar-toggler" 
				   type="button" 
				   data-bs-toggle="collapse" 
				   data-bs-target="#navbarNavAltMarkup" 
				   aria-controls="navbarNavAltMarkup" 
				   aria-expanded="false" 
				   aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" 
					id="navbarNavAltMarkup">
					<div class="navbar-nav gap-2 w-100">
						<a class="nav-link text-white" 
							href="#">Início</a>
						<div class="dropdown">
							<button class="btn dropdown-toggle"
								type="button" 
								id="dropdownMenuButton" 
								data-bs-toggle="dropdown" 
								aria-haspopup="true" 
								aria-expanded="false">
								Catalogo</button>
							<div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
								<a class="dropdown-item" href="#">1</a>
								<a class="dropdown-item" href="#">2</a>
								<a class="dropdown-item" href="#">3</a>
							</div>
						</div>
						<a class="nav-link text-white" 
							href="#">Sobre</a>
						<input class="form-control w-25 mx-auto" 
						type="search" 
						placeholder="search" 
						aria-label="search">
						<a class="nav-link ms-auto p-2 bg-success text-white rounded-1" 
							href="#">Entrar</a>
					</div>
				</div>
			</div>
		</nav>
		<header class="d-flex flex-column align-items-center border-bottom">
			<h1 class="display-6">Aprenda a construir interfaces</h1>
			<p class="lead">Grade responsiva, componentes prontos e utilitarios</p>
			<button class="btn btn-primary" type="button">Ver cursos</button>
		</header>
		<main>
			<div class="container">
				<div class="row">
					<div class="col-12 col-sm-6 col-lg-4">
						<div class="text-dark d-flex flex-column border flex-grow-1">
							<img src="https://placehold.co/400x300"
							class="img-fluid"
							alt="imagem placeholder">
							<p class="bg-success text-white border rounded-3 me-auto">Novo</p>
							<h3 class="">Layout com grade</h3>
							<p class="">Container, row e col: a base de toda página Bootstrap.</p>
							<div class="d-grid">
								<button class="btn btn-light text-dark border border-3 border-primary">Saiba mais
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
		<footer>
		</footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"></script>
	</body>
</html>
